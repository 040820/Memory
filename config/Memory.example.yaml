# ============================================================================
# LiCoMemory 主配置模板。复制为 config/Memory.yaml 后按需修改（该文件已 gitignore）。
#
# 端点与密钥类字段（llm/query_llm/embedding 的 base_url、model、api_key 等）
# 推荐统一写在项目根目录 .env（LICO_* 变量），加载时会覆盖本文件同名字段；
# 优先级：进程环境变量 > .env > 本文件。
# ============================================================================
index_name:
data_type: LOCOMO  # 数据集类型："LongmemEval" 或 "LOCOMO"
data_root: /your/dataroot
dataset_name:
working_dir: /your/workingdirectory
################################# Embedding #################################
embedding:
  api_type: "hf"          # hf=本地模型；openai=OpenAI 兼容接口（服务器 vLLM 也用这个）
  api_key: "YOUR_API_KEY"
  model: "your/model"
  base_url: ""            # OpenAI 兼容接口地址，如 http://10.11.154.244:8015/v1（通常由 .env 提供）
  cache_dir: "/your/cachedirectory"
  dimensions: 1024
  max_token_size: 8102
  embed_batch_size: 128
  embedding_func_max_async: 10
#################################### LLM ####################################
llm:
  api_type: "open_llm"
  model: 'your/model'
  base_url: "your/baseurl"
  api_key: "YOUR_API_KEY"
  
  max_token: 131072
  temperature: 0.0
  enable_concurrent: True      
  max_concurrent: 16
  timeout: 600

query_llm:
  # 查询阶段独立 LLM。留空 / 0 / -1 = 跟随上方 llm 配置（回退逻辑见 init/graph_rag.py）。
  # 需要独立端点时请写在项目根目录 .env（LICO_QUERY_LLM_*），不要在这里填 URL。
  api_type: "openai"
  base_url: ""
  model: ""
  api_key: ""
  max_token: 0
  temperature: -1.0
  timeout: 0
################################### Chunk ###################################
chunk:
  chunk_token_size: 1200
  chunk_overlap_token_size: 100
  token_model: your/model
  dialogue_input: True
################################# Dialogue #################################
dialog:
  enable_turn_pairing: True           
  include_session_metadata: True      
  validate_dialog_format: True        
################################# Graph #################################
graph:
  graph_type: dynamic_memory
  force: True              
  add: False   
  # V2 证据记忆：独立事实/变化记录存储（可选；false=保持原版行为，详见 experiments/07、08）
  enable_evidence_memory: false
  entity_merge_threshold: 0.85
  relationship_merge_threshold: 1
################################# Retriever #################################
retriever:
  top_k: 5  
  top_k_triples: 20
  top_chunks: 15           
  enable_summary: True            
  top_summary: 1      
  enable_visual: False       
  top_visual: 15
  enable_full: True
  enable_sessiontime: True

  enable_CogniRank: False
  summary_weight: 0.2 
  rerank_k: 0.1          
################################# Evaluation #################################
evaluation:
  enable_llm_eval: True
  eval_model: 'your/model'
  eval_temperature: 0.0
  eval_max_tokens: 10
